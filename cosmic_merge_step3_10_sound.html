<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Merge 星球合成計畫</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 25% 15%,#463477 0%,#181633 47%,#0d1126 100%);color:white;font-family:Arial,"Microsoft JhengHei",sans-serif;text-align:center}h1{color:#f8d99d;margin:22px 0 8px}p{color:#d7cfee}#panel{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;margin:12px auto}#score{font-weight:bold;color:#ffe5a5;font-size:22px}#best-score{font-weight:bold;color:#c8f4ff;font-size:18px}#next{font-size:17px}#combo{font-size:17px;font-weight:bold;color:#ffca83;min-width:105px}#combo.active{color:#ffda72;text-shadow:0 0 12px #ffaf4a}#game-container{width:min(400px,95vw);aspect-ratio:400/550;margin:15px auto;border:3px solid #a394e9;border-radius:12px;background:rgba(23,22,60,.8);overflow:hidden;position:relative;cursor:crosshair;touch-action:none}canvas{display:block;width:100%;height:100%}button{background:#6f5ac2;color:white;border:1px solid #b8aafa;border-radius:9px;padding:10px 20px;font-size:16px;cursor:pointer}button:hover{background:#8971dc}#game-over{display:none;max-width:400px;margin:12px auto;padding:14px;background:#41305f;border:2px solid #dd9fb7;border-radius:12px}#game-over.show{display:block}.hint{font-size:14px;margin:10px auto 25px}
/* Step 3-9 星球圖鑑 */
#collection-overlay{position:fixed;inset:0;background:rgba(5,7,25,.78);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#collection-overlay.show{display:flex}
.collection-panel{background:linear-gradient(160deg,#30254f,#171832);border:2px solid #ac96ed;border-radius:18px;max-width:620px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;box-shadow:0 12px 50px #0009}
.collection-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.collection-head h2{margin:0;color:#ffe5a5}
#collection-progress{color:#d4c7f4;margin:12px 0}.collection-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:12px}
.collection-item{background:#38315e;border:1px solid #7766a8;border-radius:12px;padding:12px 5px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.collection-item.locked{filter:grayscale(.8);opacity:.7}.collection-orb{height:55px;width:55px;border-radius:50%;display:grid;place-items:center;font-size:25px;box-shadow:inset -9px -8px 16px #15132a88,0 0 14px #ffffff20}
.collection-item strong{font-size:13px}.collection-item small{color:#c9c1e1}
@media(max-width:500px){#panel{gap:10px}.collection-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.collection-panel{padding:12px}}
</style>
</head>
<body>
<h1>✦ COSMIC MERGE ✦</h1>
<p>宇宙星球合成計畫</p>
<div id="panel"><span id="score">分數：0</span><span id="best-score">最高分：0</span><span id="next">下一顆：—</span><span id="combo" aria-live="polite">COMBO ×0</span><button id="restart">重新開始</button><button id="open-collection" type="button">🪐 星球圖鑑</button><button id="sound-toggle" type="button" aria-pressed="false">🔊 音效開啟</button></div>
<div id="game-container"></div>
<div id="game-over" role="status"><strong>遊戲結束！</strong><p id="final-score"></p><p>按「重新開始」再玩一次。</p></div>
<div id="collection-overlay" role="dialog" aria-modal="true" aria-labelledby="collection-title" aria-hidden="true">
  <div class="collection-panel">
    <div class="collection-head"><h2 id="collection-title">🪐 星球圖鑑</h2><button id="close-collection" type="button">關閉 ✕</button></div>
    <p id="collection-progress"></p><div id="collection-grid" class="collection-grid"></div>
    <p class="hint">成功投放或合成星球，就能永久解鎖對應等級（儲存在這個瀏覽器）。</p>
  </div>
</div>
<p class="hint">移動滑鼠選擇位置，點擊投放。相同等級的星球碰撞會合成！</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
if(typeof Matter==='undefined'){
 document.getElementById('game-container').textContent='Matter.js 載入失敗，請檢查網路連線後重新整理。';
 throw new Error('Matter.js 未載入');
}
const {Engine,Render,Runner,Bodies,Body,Composite,Events}=Matter;
const width=400,height=550;
const levels=[
 {name:'宇宙塵埃',radius:16,color:'#b9a3ee'},
 {name:'小行星',radius:21,color:'#9fa7b8'},
 {name:'月球',radius:27,color:'#d4d7e3'},
 {name:'火星',radius:33,color:'#ed887a'},
 {name:'地球',radius:40,color:'#5ca9ed'},
 {name:'金星',radius:47,color:'#e8b473'},
 {name:'土星',radius:55,color:'#e6cd8d'},
 {name:'木星',radius:63,color:'#cf9c78'},
 {name:'海王星',radius:72,color:'#7291e9'},
 {name:'太陽',radius:83,color:'#ffc65d'},
 {name:'銀河核心',radius:95,color:'#dba6ff'}
];
// Step 3-9：圖鑑使用獨立的 localStorage 紀錄，不會因重新開始清除。
const COLLECTION_KEY='cosmicMergeCollectionV1';
function readCollection(){
 try{
  const saved=JSON.parse(localStorage.getItem(COLLECTION_KEY)||'[]');
  return new Set(Array.isArray(saved)?saved.filter(n=>Number.isInteger(n)&&n>=0&&n<levels.length):[]);
 }catch(error){return new Set();}
}
const unlockedLevels=readCollection();
const collectionOverlay=document.getElementById('collection-overlay');
const collectionGrid=document.getElementById('collection-grid');
const collectionProgress=document.getElementById('collection-progress');
function unlockPlanet(level){
 if(unlockedLevels.has(level))return;
 unlockedLevels.add(level);
 try{localStorage.setItem(COLLECTION_KEY,JSON.stringify([...unlockedLevels].sort((a,b)=>a-b)));}catch(error){}
 if(collectionOverlay.classList.contains('show'))renderCollection();
}
function renderCollection(){
 collectionGrid.replaceChildren();
 collectionProgress.textContent=`已解鎖 ${unlockedLevels.size} / ${levels.length} 顆星球`;
 levels.forEach((planet,i)=>{
  const known=unlockedLevels.has(i);
  const item=document.createElement('div');item.className='collection-item'+(known?'':' locked');
  const orb=document.createElement('div');orb.className='collection-orb';
  orb.style.background=known?`radial-gradient(circle at 30% 25%, #fff, ${planet.color} 38%, #25213c)`:'#49435d';
  orb.textContent=known?['✦','☄','☾','♂','🌍','♀','🪐','♃','♆','☀','✺'][i]:'?';
  const label=document.createElement('strong');label.textContent=known?planet.name:'尚未解鎖';
  const number=document.createElement('small');number.textContent='Lv.'+(i+1);
  item.append(orb,label,number);collectionGrid.appendChild(item);
 });
}
function closeCollection(){collectionOverlay.classList.remove('show');collectionOverlay.setAttribute('aria-hidden','true');}
document.getElementById('open-collection').addEventListener('click',()=>{
 renderCollection();collectionOverlay.classList.add('show');collectionOverlay.setAttribute('aria-hidden','false');
});
document.getElementById('close-collection').addEventListener('click',closeCollection);
collectionOverlay.addEventListener('click',e=>{if(e.target===collectionOverlay)closeCollection();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCollection();});
// Step 3-10：用 Web Audio API 產生音效，不需要另外下載聲音檔。
const SOUND_KEY='cosmicMergeSoundEnabledV1';
let soundEnabled=true;
try{const stored=localStorage.getItem(SOUND_KEY);if(stored!==null)soundEnabled=stored==='true';}catch(error){}
let audioContext=null;
const soundButton=document.getElementById('sound-toggle');
function updateSoundButton(){
 soundButton.textContent=soundEnabled?'🔊 音效開啟':'🔇 音效關閉';
 soundButton.setAttribute('aria-pressed',String(!soundEnabled));
}
updateSoundButton();
function unlockAudio(){
 if(!soundEnabled)return;
 try{
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)return;
  if(!audioContext)audioContext=new AudioCtor();
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
 }catch(error){}
}
// 小音符：每次建立短暫的 oscillator，播放完即釋放。
function tone(frequency,duration,shape='sine',volume=.055,delay=0){
 if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
 try{
  const start=audioContext.currentTime+delay;
  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();
  oscillator.type=shape;oscillator.frequency.setValueAtTime(frequency,start);
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(Math.max(.001,volume),start+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
  oscillator.connect(gain);gain.connect(audioContext.destination);
  oscillator.start(start);oscillator.stop(start+duration+.015);
 }catch(error){}
}
function playDrop(){tone(300,.10,'sine',.035);}
function playMerge(level){
 const base=Math.min(880,320+level*47);
 tone(base,.15,'sine',.045);
 tone(base*1.5,.20,'sine',.035,.09);
}
function playGameOver(){
 tone(420,.30,'triangle',.045);
 tone(310,.34,'triangle',.04,.22);
 tone(220,.45,'triangle',.04,.45);
}
soundButton.addEventListener('click',()=>{
 soundEnabled=!soundEnabled;
 try{localStorage.setItem(SOUND_KEY,String(soundEnabled));}catch(error){}
 updateSoundButton();
 if(soundEnabled){unlockAudio();tone(660,.12,'sine',.045);}
});
const container=document.getElementById('game-container');
const scoreEl=document.getElementById('score');
const bestScoreEl=document.getElementById('best-score');
const BEST_KEY='cosmicMergeBestScoreV1';
// 無痕模式或隱私設定可能禁止 localStorage：失敗時仍可正常遊玩。
function readBestScore(){
 try{const saved=Number(localStorage.getItem(BEST_KEY));return Number.isFinite(saved)&&saved>=0?saved:0;}
 catch(error){return 0;}
}
let bestScore=readBestScore();
function updateBestScore(){
 if(score<=bestScore)return;
 bestScore=score;
 bestScoreEl.textContent='最高分：'+bestScore;
 try{localStorage.setItem(BEST_KEY,String(bestScore));}catch(error){}
}
bestScoreEl.textContent='最高分：'+bestScore;
const nextEl=document.getElementById('next');
const engine=Engine.create();engine.gravity.y=1;
const render=Render.create({element:container,engine,options:{width,height,wireframes:false,background:'transparent'}});
const wallOptions={isStatic:true,render:{visible:false}};
Composite.add(engine.world,[
 Bodies.rectangle(200,560,400,20,wallOptions),
 Bodies.rectangle(-10,275,20,550,wallOptions),
 Bodies.rectangle(410,275,20,550,wallOptions)
]);
const runner=Runner.create();
let score=0,canDrop=true,dropX=200,roundId=0;
let gameOver=false, overflowStartedAt=null;
// 連鎖合成：在 1.8 秒內再次合成，視為同一個 Combo。
const comboWindow=1800;
let comboCount=0,lastMergeAt=-Infinity,comboFlashUntil=0;
const comboEl=document.getElementById('combo');
function resetCombo(){comboCount=0;lastMergeAt=-Infinity;comboFlashUntil=0;comboEl.textContent='COMBO ×0';comboEl.classList.remove('active');}
function applyMergeScore(newLevel){
 const now=engine.timing.timestamp;
 comboCount=now-lastMergeAt<=comboWindow?comboCount+1:1;
 lastMergeAt=now;
 const basePoints=10*2**(newLevel-1);
 // 第一個合成不加成；之後每多一次連擊加 25%，最多加成 100%。
 const bonus=Math.round(basePoints*0.25*Math.min(comboCount-1,4));
 score+=basePoints+bonus;
 scoreEl.textContent='分數：'+score;updateBestScore();
 comboEl.textContent='COMBO ×'+comboCount+(bonus?' +'+bonus:'');
 comboEl.classList.toggle('active',comboCount>=2);
 comboFlashUntil=now+850;
}
const dangerY=75, overflowDuration=2000; // 警戒線和持續時間（毫秒）
const gameOverEl=document.getElementById('game-over');
let currentLevel=0;
let nextLevel=0;
const randomLevel=()=>Math.floor(Math.random()*3); // 只投放 Lv.1-3
function clampX(x,r){return Math.max(r,Math.min(width-r,x));}
function getGameX(event){const rect=render.canvas.getBoundingClientRect();return (event.clientX-rect.left)*width/rect.width;}
function drawOptions(level,preview=false){return {isStatic:preview,isSensor:preview,restitution:.22,friction:.35,frictionStatic:.75,label:'planet',render:{fillStyle:levels[level].color,strokeStyle:'#ffffff',lineWidth:2,opacity:preview ? 0.65 : 1,visible:!preview}};}
function createPlanet(x,y,level){unlockPlanet(level);const p=Bodies.circle(x,y,levels[level].radius,drawOptions(level));p.plugin.planetLevel=level;Composite.add(engine.world,p);return p;}
let previewPlanet=Bodies.circle(dropX,40,levels[0].radius,drawOptions(0,true));
Composite.add(engine.world,previewPlanet);
function refreshPreview(){
 const radius=levels[currentLevel].radius;
 dropX=clampX(dropX,radius);
 Composite.remove(engine.world,previewPlanet);
 previewPlanet=Bodies.circle(dropX,Math.max(30,radius+5),radius,drawOptions(currentLevel,true));
 previewPlanet.plugin.planetLevel=currentLevel;
 // 只由自訂 Canvas 畫出預覽，避免 Matter.js 畫出單色圓球。
 previewPlanet.render.visible=false;
 Composite.add(engine.world,previewPlanet);
 nextEl.textContent='下一顆：'+levels[nextLevel].name;
}
function setPreviewX(x){dropX=clampX(x,levels[currentLevel].radius);Body.setPosition(previewPlanet,{x:dropX,y:Math.max(30,levels[currentLevel].radius+5)});}
container.addEventListener('pointermove',e=>setPreviewX(getGameX(e)));
container.addEventListener('pointerdown',e=>{
 if(e.button!==undefined&&e.button!==0)return;
 if(!canDrop||gameOver)return;
 unlockAudio();
 setPreviewX(getGameX(e));
 playDrop();
 canDrop=false;previewPlanet.render.visible=false;
 createPlanet(dropX,Math.max(30,levels[currentLevel].radius+5),currentLevel);
 currentLevel=nextLevel;nextLevel=randomLevel();
 const thisRound=roundId;
 setTimeout(()=>{if(thisRound!==roundId)return;canDrop=true;refreshPreview();},500);
});
// 收集碰撞中的合成配對；一顆星球每一輪至多合成一次。
const mergePairs=[];
Events.on(engine,'collisionStart',event=>{
 for(const pair of event.pairs){
  const a=pair.bodyA,b=pair.bodyB;
  if(a.label!=='planet'||b.label!=='planet')continue;
  if(a===previewPlanet||b===previewPlanet)continue;
  if(a.plugin.planetLevel!==b.plugin.planetLevel)continue;
  if(a.plugin.planetLevel>=levels.length-1)continue;
  mergePairs.push([a,b]);
 }
});
Events.on(engine,'afterUpdate',()=>{
 const used=new Set();
 while(mergePairs.length){
  const [a,b]=mergePairs.shift();
  if(used.has(a.id)||used.has(b.id))continue;
  if(!Composite.get(engine.world,a.id,'body')||!Composite.get(engine.world,b.id,'body'))continue;
  const lv=a.plugin.planetLevel;
  if(lv!==b.plugin.planetLevel||lv>=levels.length-1)continue;
  used.add(a.id);used.add(b.id);
  const x=(a.position.x+b.position.x)/2;
  const y=(a.position.y+b.position.y)/2;
  Composite.remove(engine.world,a);Composite.remove(engine.world,b);
  const newLevel=lv+1;
  const born=createPlanet(clampX(x,levels[newLevel].radius),y,newLevel);
  Body.setVelocity(born,{x:(a.velocity.x+b.velocity.x)/2,y:Math.min(a.velocity.y,b.velocity.y)-2});
  applyMergeScore(newLevel);
  playMerge(newLevel);
 }
 // 連擊時間到後清除提示，但不影響已得到的分數。
 if(comboCount>0 && engine.timing.timestamp-lastMergeAt>comboWindow)resetCombo();
 // 投放中或合成後暫不判定，避免剛出現的球直接觸發失敗。
 if(gameOver||!canDrop){overflowStartedAt=null;return;}
 const exceeded=Composite.allBodies(engine.world).some(body=>
  body.label==='planet' && body!==previewPlanet &&
  body.position.y-body.circleRadius<dangerY && body.speed<1.8
 );
 if(!exceeded){overflowStartedAt=null;return;}
 const now=engine.timing.timestamp;
 if(overflowStartedAt===null)overflowStartedAt=now;
 if(now-overflowStartedAt>=overflowDuration){
  gameOver=true;canDrop=false;previewPlanet.render.visible=false;
  document.getElementById('final-score').textContent='本次得分：'+score+' ｜ 最高分：'+bestScore;
  gameOverEl.classList.add('show');
  playGameOver();
 }
});
document.getElementById('restart').addEventListener('click',()=>{
 roundId++;mergePairs.length=0;gameOver=false;overflowStartedAt=null;gameOverEl.classList.remove('show');
 for(const body of Composite.allBodies(engine.world)){if(body.label==='planet'&&body!==previewPlanet)Composite.remove(engine.world,body);}
 score=0;scoreEl.textContent='分數：0';resetCombo();currentLevel=randomLevel();nextLevel=randomLevel();
 canDrop=true;refreshPreview();
});
currentLevel=randomLevel();nextLevel=randomLevel();refreshPreview();
// 繪製紅色警戒線：用 render 的畫布事件，不會參與碰撞。
Events.on(render,'afterRender',()=>{
 const ctx=render.context;ctx.save();ctx.beginPath();ctx.setLineDash([8,6]);
 ctx.moveTo(0,dangerY);ctx.lineTo(width,dangerY);
 ctx.strokeStyle='#ff839a';ctx.lineWidth=2;ctx.stroke();ctx.restore();
});
// Step 3-7：只增加 Canvas 星球插畫，不改物理碰撞和計分規則。
function drawPlanetArt(ctx,body){
 const lv=body.plugin.planetLevel;
 if(!Number.isInteger(lv)||lv<0||lv>=levels.length)return;
 const r=body.circleRadius;
 ctx.save();
 ctx.translate(body.position.x,body.position.y);
 ctx.rotate(body.angle);
 ctx.globalAlpha=(body===previewPlanet?0.9:1);
 // 星空光暈
 ctx.shadowColor=levels[lv].color;
 ctx.shadowBlur=lv>=8?18:8;
 const grad=ctx.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);
 grad.addColorStop(0,'#ffffff');
 grad.addColorStop(.16,levels[lv].color);
 grad.addColorStop(1, lv===9?'#ef7d3b':lv===10?'#613a92':'#28294c');
 ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
 ctx.fillStyle=grad;ctx.fill();
 ctx.shadowBlur=0;
 ctx.save();ctx.beginPath();ctx.arc(0,0,r-1,0,Math.PI*2);ctx.clip();
 // 不同等級各自的表面紋理
 if(lv===0){
   ctx.fillStyle='#f8e4ff';ctx.beginPath();ctx.arc(-r*.22,-r*.22,r*.19,0,7);ctx.fill();
   ctx.fillStyle='#9573df';ctx.beginPath();ctx.arc(r*.3,r*.17,r*.19,0,7);ctx.fill();
 } else if([1,2,3].includes(lv)){
   ctx.fillStyle=lv===3?'#af504d':'#737d96';
   for(const [x,y,z] of [[-.3,-.1,.19],[.33,.25,.12],[.17,-.35,.1]]){
     ctx.beginPath();ctx.arc(x*r,y*r,z*r,0,Math.PI*2);ctx.fill();
   }
 } else if(lv===4){ // 地球海洋與陸地
   ctx.fillStyle='#4eacd5';ctx.beginPath();ctx.arc(0,0,r*.84,0,7);ctx.fill();
   ctx.fillStyle='#68cc97';
   ctx.beginPath();ctx.moveTo(-.68*r,-.35*r);ctx.lineTo(-.13*r,-.65*r);ctx.lineTo(.22*r,-.34*r);ctx.lineTo(.02*r,.07*r);ctx.lineTo(.37*r,.35*r);ctx.lineTo(.08*r,.7*r);ctx.lineTo(-.37*r,.39*r);ctx.lineTo(-.6*r,0);ctx.closePath();ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(-r*.5,r*.12,r*.38,r*.08);
 } else if([5,6,7,8].includes(lv)){
   ctx.strokeStyle=lv===8?'#92c8ff':'#fbe0a7';
   ctx.lineWidth=Math.max(3,r*.13);
   for(let y=-r*.65;y<=r*.65;y+=r*.35){ctx.beginPath();ctx.moveTo(-r,y);ctx.bezierCurveTo(-r*.3,y-r*.13,r*.3,y+r*.13,r,y);ctx.stroke();}
 } else if(lv===9){
   ctx.strokeStyle='#ffe996';ctx.lineWidth=3;
   for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(r*.35*Math.cos(a),r*.35*Math.sin(a));ctx.lineTo(r*.9*Math.cos(a+.2),r*.9*Math.sin(a+.2));ctx.stroke();}
 } else if(lv===10){
   ctx.strokeStyle='#edd1ff';ctx.lineWidth=Math.max(3,r*.09);
   for(let a=0;a<Math.PI*3;a+=.08){const t=1-a/(Math.PI*3);ctx.beginPath();ctx.arc(0,0,r*t*.82,a,a+.10);ctx.stroke();}
 }
 ctx.restore();
 // 土星環（同時顯示在星球前面，裝飾不影響物理圓形範圍）
 if(lv===6){
   ctx.save();ctx.rotate(-.32);ctx.scale(1,.35);ctx.beginPath();ctx.ellipse(0,0,r*.94,r*.94,0,0,Math.PI*2);
   ctx.strokeStyle='rgba(255,243,191,.9)';ctx.lineWidth=r*.15;ctx.stroke();ctx.restore();
 }
 ctx.beginPath();ctx.arc(0,0,r-.8,0,Math.PI*2);
 ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.5;ctx.stroke();
 ctx.restore();
}
Events.on(render,'afterRender',()=>{
 const ctx=render.context;
 for(const body of Composite.allBodies(engine.world)){
  if(body.label==='planet' && (body===previewPlanet ? (canDrop&&!gameOver) : body.render.visible!==false))drawPlanetArt(ctx,body);
 }
});
Render.run(render);Runner.run(runner,engine);
</script>
</body>
</html>
