<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Merge 星球合成計畫</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 25% 15%,#463477 0%,#181633 47%,#0d1126 100%);color:white;font-family:Arial,"Microsoft JhengHei",sans-serif;text-align:center}h1{color:#f8d99d;margin:22px 0 8px}p{color:#d7cfee}#panel{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;margin:12px auto}#score{font-weight:bold;color:#ffe5a5;font-size:22px}#next{font-size:17px}#game-container{width:min(400px,95vw);aspect-ratio:400/550;margin:15px auto;border:3px solid #a394e9;border-radius:12px;background:rgba(23,22,60,.8);overflow:hidden;position:relative;cursor:crosshair;touch-action:none}canvas{display:block;width:100%;height:100%}button{background:#6f5ac2;color:white;border:1px solid #b8aafa;border-radius:9px;padding:10px 20px;font-size:16px;cursor:pointer}button:hover{background:#8971dc}#game-over{display:none;max-width:400px;margin:12px auto;padding:14px;background:#41305f;border:2px solid #dd9fb7;border-radius:12px}#game-over.show{display:block}.hint{font-size:14px;margin:10px auto 25px}
</style>
</head>
<body>
<h1>✦ COSMIC MERGE ✦</h1>
<p>宇宙星球合成計畫</p>
<div id="panel"><span id="score">分數：0</span><span id="next">下一顆：—</span><button id="restart">重新開始</button></div>
<div id="game-container"></div>
<div id="game-over" role="status"><strong>遊戲結束！</strong><p id="final-score"></p><p>按「重新開始」再玩一次。</p></div>
<p class="hint">移動滑鼠選擇位置，點擊投放。相同等級的星球碰撞會合成！</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
if(typeof Matter==='undefined'){
 document.getElementById('game-container').textContent='Matter.js 載入失敗，請檢查網路連線後重新整理。';
 throw new Error('Matter.js 未載入');
}
const {Engine,Render,Runner,Bodies,Body,Composite,Events}=Matter;
const width=400,height=550;
const levels=[
 {name:'宇宙塵埃',radius:16,color:'#b9a3ee'},
 {name:'小行星',radius:21,color:'#9fa7b8'},
 {name:'月球',radius:27,color:'#d4d7e3'},
 {name:'火星',radius:33,color:'#ed887a'},
 {name:'地球',radius:40,color:'#5ca9ed'},
 {name:'金星',radius:47,color:'#e8b473'},
 {name:'土星',radius:55,color:'#e6cd8d'},
 {name:'木星',radius:63,color:'#cf9c78'},
 {name:'海王星',radius:72,color:'#7291e9'},
 {name:'太陽',radius:83,color:'#ffc65d'},
 {name:'銀河核心',radius:95,color:'#dba6ff'}
];
const container=document.getElementById('game-container');
const scoreEl=document.getElementById('score');
const nextEl=document.getElementById('next');
const engine=Engine.create();engine.gravity.y=1;
const render=Render.create({element:container,engine,options:{width,height,wireframes:false,background:'transparent'}});
const wallOptions={isStatic:true,render:{visible:false}};
Composite.add(engine.world,[
 Bodies.rectangle(200,560,400,20,wallOptions),
 Bodies.rectangle(-10,275,20,550,wallOptions),
 Bodies.rectangle(410,275,20,550,wallOptions)
]);
const runner=Runner.create();
let score=0,canDrop=true,dropX=200,roundId=0;
let gameOver=false, overflowStartedAt=null;
const dangerY=75, overflowDuration=2000; // 警戒線和持續時間（毫秒）
const gameOverEl=document.getElementById('game-over');
let currentLevel=0;
let nextLevel=0;
const randomLevel=()=>Math.floor(Math.random()*3); // 只投放 Lv.1-3
function clampX(x,r){return Math.max(r,Math.min(width-r,x));}
function getGameX(event){const rect=render.canvas.getBoundingClientRect();return (event.clientX-rect.left)*width/rect.width;}
function drawOptions(level,preview=false){return {isStatic:preview,isSensor:preview,restitution:.22,friction:.35,frictionStatic:.75,label:'planet',render:{fillStyle:levels[level].color,strokeStyle:'#ffffff',lineWidth:2,opacity:preview ? 0.65 : 1}};}
function createPlanet(x,y,level){const p=Bodies.circle(x,y,levels[level].radius,drawOptions(level));p.plugin.planetLevel=level;Composite.add(engine.world,p);return p;}
let previewPlanet=Bodies.circle(dropX,40,levels[0].radius,drawOptions(0,true));
Composite.add(engine.world,previewPlanet);
function refreshPreview(){
 const radius=levels[currentLevel].radius;
 dropX=clampX(dropX,radius);
 Composite.remove(engine.world,previewPlanet);
 previewPlanet=Bodies.circle(dropX,Math.max(30,radius+5),radius,drawOptions(currentLevel,true));
 previewPlanet.render.visible=canDrop&&!gameOver;
 Composite.add(engine.world,previewPlanet);
 nextEl.textContent='下一顆：'+levels[nextLevel].name;
}
function setPreviewX(x){dropX=clampX(x,levels[currentLevel].radius);Body.setPosition(previewPlanet,{x:dropX,y:Math.max(30,levels[currentLevel].radius+5)});}
container.addEventListener('pointermove',e=>setPreviewX(getGameX(e)));
container.addEventListener('pointerdown',e=>{
 if(e.button!==undefined&&e.button!==0)return;
 if(!canDrop||gameOver)return;
 setPreviewX(getGameX(e));
 canDrop=false;previewPlanet.render.visible=false;
 createPlanet(dropX,Math.max(30,levels[currentLevel].radius+5),currentLevel);
 currentLevel=nextLevel;nextLevel=randomLevel();
 const thisRound=roundId;
 setTimeout(()=>{if(thisRound!==roundId)return;canDrop=true;refreshPreview();},500);
});
// 收集碰撞中的合成配對；一顆星球每一輪至多合成一次。
const mergePairs=[];
Events.on(engine,'collisionStart',event=>{
 for(const pair of event.pairs){
  const a=pair.bodyA,b=pair.bodyB;
  if(a.label!=='planet'||b.label!=='planet')continue;
  if(a===previewPlanet||b===previewPlanet)continue;
  if(a.plugin.planetLevel!==b.plugin.planetLevel)continue;
  if(a.plugin.planetLevel>=levels.length-1)continue;
  mergePairs.push([a,b]);
 }
});
Events.on(engine,'afterUpdate',()=>{
 const used=new Set();
 while(mergePairs.length){
  const [a,b]=mergePairs.shift();
  if(used.has(a.id)||used.has(b.id))continue;
  if(!Composite.get(engine.world,a.id,'body')||!Composite.get(engine.world,b.id,'body'))continue;
  const lv=a.plugin.planetLevel;
  if(lv!==b.plugin.planetLevel||lv>=levels.length-1)continue;
  used.add(a.id);used.add(b.id);
  const x=(a.position.x+b.position.x)/2;
  const y=(a.position.y+b.position.y)/2;
  Composite.remove(engine.world,a);Composite.remove(engine.world,b);
  const newLevel=lv+1;
  const born=createPlanet(clampX(x,levels[newLevel].radius),y,newLevel);
  Body.setVelocity(born,{x:(a.velocity.x+b.velocity.x)/2,y:Math.min(a.velocity.y,b.velocity.y)-2});
  score+=10*2**(newLevel-1);scoreEl.textContent='分數：'+score;
 }
 // 投放中或合成後暫不判定，避免剛出現的球直接觸發失敗。
 if(gameOver||!canDrop){overflowStartedAt=null;return;}
 const exceeded=Composite.allBodies(engine.world).some(body=>
  body.label==='planet' && body!==previewPlanet &&
  body.position.y-body.circleRadius<dangerY && body.speed<1.8
 );
 if(!exceeded){overflowStartedAt=null;return;}
 const now=engine.timing.timestamp;
 if(overflowStartedAt===null)overflowStartedAt=now;
 if(now-overflowStartedAt>=overflowDuration){
  gameOver=true;canDrop=false;previewPlanet.render.visible=false;
  document.getElementById('final-score').textContent='本次得分：'+score;
  gameOverEl.classList.add('show');
 }
});
document.getElementById('restart').addEventListener('click',()=>{
 roundId++;mergePairs.length=0;gameOver=false;overflowStartedAt=null;gameOverEl.classList.remove('show');
 for(const body of Composite.allBodies(engine.world)){if(body.label==='planet'&&body!==previewPlanet)Composite.remove(engine.world,body);}
 score=0;scoreEl.textContent='分數：0';currentLevel=randomLevel();nextLevel=randomLevel();
 canDrop=true;refreshPreview();
});
currentLevel=randomLevel();nextLevel=randomLevel();refreshPreview();
// 繪製紅色警戒線：用 render 的畫布事件，不會參與碰撞。
Events.on(render,'afterRender',()=>{
 const ctx=render.context;ctx.save();ctx.beginPath();ctx.setLineDash([8,6]);
 ctx.moveTo(0,dangerY);ctx.lineTo(width,dangerY);
 ctx.strokeStyle='#ff839a';ctx.lineWidth=2;ctx.stroke();ctx.restore();
});
Render.run(render);Runner.run(runner,engine);
</script>
</body>
</html>
